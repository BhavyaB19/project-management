version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: velozity-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: velozity_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d velozity_dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Store (BullMQ Background Jobs & Schedulers)
  redis:
    image: redis:7-alpine
    container_name: velozity-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend Express API & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velozity-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/velozity_dashboard?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: velozity-production-jwt-access-secret-key-32chars
      JWT_REFRESH_SECRET: velozity-production-jwt-refresh-secret-key-32chars
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: sh -c "npx prisma db push && npm run seed && npm run dev"

  # 4. Frontend React + Vite Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velozity-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_WS_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  redis_data:
